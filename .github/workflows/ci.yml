name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Production Build
        run: npm run build

      - name: Smoke Test Consultation API & Email Service
        run: |
          node --input-type=module -e "import { handleConsultationRequest } from './server/emailService.js'; (async () => { const res = await handleConsultationRequest({ name: 'CI Verification', email: 'ci@avora.test', phone: '+1 415 555 0199', serviceName: 'CI Test Suite' }); if (!res.success) { console.error('API Verification Failed', res); process.exit(1); } console.log('✓ Consultation API Verification Passed'); })();"
